{% extends "base.html" %}

{% block title %}Teacher Login{% endblock %}

{% block nav_links %}
<a href="{{ url_for('index') }}" class="btn btn-outline">Back to Home</a>
{% endblock %}

{% block content %}
<div class="login-container fade-in-up">
    <div class="glass-card login-card mx-auto">
        <div class="text-center mb-4">
            <h2>Teacher Login</h2>
            <p>Access your dashboard</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Department</label>
                <select id="loginDept" class="form-control" required>
                    <option value="" disabled selected>Select Department</option>
                    <option value="Dept1">Dept1</option>
                    <option value="Dept2">Dept2</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Teacher ID</label>
                <input type="text" id="loginId" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2" id="loginBtn">
                <span class="btn-text">Login</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
