{% extends "base.html" %}

{% block title %}Student Portal{% endblock %}

{% block nav_links %}
<a href="{{ url_for('index') }}" class="btn btn-outline">Back to Home</a>
<button class="btn btn-outline" id="studentLogoutBtn" style="margin-left: 10px;">Logout</button>
{% endblock %}

{% block content %}
<div class="portal-container fade-in-up">
    <div class="portal-header text-center mb-4">
        <h2>Student Portal</h2>
        <p>Select a department to view available teachers.</p>
    </div>

    <div class="glass-card mb-4">
        <div class="form-group">
            <label for="deptSelect">Select Department</label>
            <select id="deptSelect" class="form-control">
                <option value="" disabled selected>Choose...</option>
                <!-- Filled via JS -->
            </select>
        </div>
    </div>

    <div id="teachersContainer" class="teachers-grid">
        <!-- Teacher cards injected here -->
    </div>
</div>

<!-- Doubt Request Modal -->
<div id="requestModal" class="modal">
    <div class="modal-content glass-card fade-in-up">
        <div class="modal-header">
            <h3>Send Doubt Request</h3>
            <span class="close-btn" id="closeModal">&times;</span>
        </div>
        <div class="modal-body mt-2">
            <p id="modalTeacherName" class="font-bold mb-2"></p>
            <form id="requestForm">
                <input type="hidden" id="reqDept">
                <input type="hidden" id="reqTeacherId">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="reqName" class="form-control" value="{{ session.get('student_name', '') }}"
                        readonly required>
                </div>
                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="reqRoll" class="form-control" value="{{ session.get('student_roll', '') }}"
                        readonly required>
                </div>
                <div class="form-group">
                    <label>Doubt/Question</label>
                    <textarea id="reqDoubt" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Submit Request</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
