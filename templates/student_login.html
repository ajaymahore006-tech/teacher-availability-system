{% extends "base.html" %}

{% block title %}Student Login{% endblock %}

{% block nav_links %}
<a href="{{ url_for('index') }}" class="btn btn-outline">Back to Home</a>
{% endblock %}

{% block content %}
<div class="login-container fade-in-up">
    <div class="glass-card login-card mx-auto">
        <div class="text-center mb-4">
            <h2>Student Login</h2>
            <p>Access the student portal</p>
        </div>

        <form id="studentLoginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="studentEmail" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="studentPass" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2" id="studentLoginBtn">
                <span class="btn-text">Login</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
