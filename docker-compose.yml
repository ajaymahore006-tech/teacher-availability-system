version: '3.8'

services:
  backend:
    build:
      context: ./app
    container_name: dfa-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/backend/app

  frontend:
    build:
      context: ./frontend
    container_name: dfa-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
